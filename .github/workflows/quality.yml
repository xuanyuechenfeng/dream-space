name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safeguards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch pull request base
        if: github.base_ref != ''
        run: git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      - name: Credential, DOM, theme and immutable bak gates
        env:
          QUALITY_BASE_REF: ${{ github.base_ref != '' && format('origin/{0}', github.base_ref) || 'HEAD^' }}
        run: node scripts/quality-gates.mjs

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit, contract and Testcontainers suites
        env:
          CI: "true"
        run: ./dream_service/mvnw -B -f dream_service/pom.xml test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            dream_web/package-lock.json
            manage_web/package-lock.json
      - run: npm --prefix dream_web ci
      - run: npm --prefix manage_web ci
      - run: npm --prefix dream_web run typecheck
      - run: npm --prefix manage_web run typecheck
      - run: npm --prefix dream_web run build
      - run: npm --prefix manage_web run build
      - run: npm --prefix dream_web run test:unit
      - run: npm --prefix manage_web run test:unit
      - run: npm --prefix dream_web exec playwright install --with-deps chromium
      - run: npm --prefix dream_web run test:e2e
      - run: npm --prefix manage_web run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            dream_web/playwright-report
            dream_web/test-results
            manage_web/playwright-report
            manage_web/test-results
          if-no-files-found: ignore
